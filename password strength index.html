   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form">
    <div class="text">
        <h2>Password Strength</h2>
    </div> 

    <div class="input-box">
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            spellcheck="false"
            minlength="6"
            maxlength="20">

        <button id="toggleBtn">Show</button>
    </div>

    <!-- ENTER BUTTON (RESTORED) -->
    <button id="enter">Enter</button>

    <div class="power-container">
        <div id="strenght"></div>
        <div id="power-point"></div>
    </div>    
</div>

<script>

let password = document.getElementById("password");
let power = document.getElementById("power-point");
let toggleBtn = document.getElementById("toggleBtn");

// SHOW / HIDE PASSWORD
toggleBtn.addEventListener("click", function () {
    if (password.type === "password") {
        password.type = "text";
        toggleBtn.innerText = "Hide";
    } else {
        password.type = "password";
        toggleBtn.innerText = "Show";
    }
});

// PASSWORD STRENGTH CHECKER
password.oninput = function () {

    let value = password.value;
    let point = 0;

    let width = ["10%", "30%", "60%", "80%", "100%"];

    let color = ["#ff4d6d", "#ff7b54", "#58b8ff", "#5cdb95", "#ff4fc3"];

    let strength = [
        "Weak ❌",
        "Medium ⚠️",
        "Strong ✅",
        "Very Strong 🔥",
        "Super Strong 🚀"
    ];

    if (value.length >= 6) {

        let rules = [
            /[0-9]/,
            /[a-z]/,
            /[A-Z]/,
            /[^0-9a-zA-Z]/
        ];

        rules.forEach(rule => {
            if (rule.test(value)) point++;
        });
    }

    power.style.width = width[point];
    power.style.background = color[point];

    document.getElementById("strenght").innerHTML = strength[point];
    document.getElementById("strenght").style.color = color[point];
};

</script>

</body>
</html>
